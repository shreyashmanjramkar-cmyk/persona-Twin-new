services:
  - type: web
    name: persona-twin-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # The database URL for SQLite
      - key: DATABASE_URL
        value: sqlite:///./sql_app.db
      # Add LLM_API_KEY and TWITTER credentials manually in Render Dashboard!

  - type: web
    name: persona-twin-frontend
    env: node
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      # Update this after the backend deploys!
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://persona-twin-backend.onrender.com
